services:
  banking-app:
    build:
      context: ./banking
      dockerfile: ../Dockerfile.banking
      target: prod
    restart: unless-stopped
    ports:
      - ${PORT}:${PORT}
    environment:
      APP_ENV: ${APP_ENV}
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
    env_file:
      - ./banking/.env
    depends_on:
      psql_bp:
        condition: service_healthy
    networks:
      - blueprint

  psql_bp:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    env_file:
      - ./banking/.env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - psql_volume_bp:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - blueprint

  banking-migration:
    build:
      context: ./banking
      dockerfile: ../Dockerfile.migration
    restart: no
    environment:
      GOOSE_DRIVER: ${GOOSE_DRIVER}
      GOOSE_DBSTRING: ${GOOSE_DBSTRING}
      GOOSE_TABLE: ${GOOSE_TABLE}
      GOOSE_MIGRATION_DIR: "./"
    env_file:
      - ./banking/.env
    depends_on:
      psql_bp:
        condition: service_healthy
    networks:
      - blueprint

  web:
    build:
      context: ./web
      dockerfile: ../Dockerfile.web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - banking-app
    networks:
      - blueprint

volumes:
  psql_volume_bp:

networks:
  blueprint:
